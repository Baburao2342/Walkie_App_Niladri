<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie - Messaging Platform</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-tertiary: #141414;
      --accent-primary: #00d9ff;
      --accent-secondary: #7000ff;
      --accent-glow: #00ff88;
      --neon-color: #00d9ff;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b8;
      --text-muted: #6b6b80;
      --border-color: #1a1a1a;
      --online-glow: #00ff88;
      --offline-gray: #2a2a2a;
    }

    .theme-light {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e9ecef;
      --accent-primary: #0066cc;
      --accent-secondary: #6610f2;
      --accent-glow: #00c853;
      --neon-color: #0066cc;
      --text-primary: #1a1a1a;
      --text-secondary: #495057;
      --text-muted: #6c757d;
      --border-color: #dee2e6;
      --online-glow: #00c853;
      --offline-gray: #ced4da;
    }

    .neon-cyan {
      --neon-color: #00d9ff;
    }

    .neon-green {
      --neon-color: #00ff88;
    }

    .neon-pink {
      --neon-color: #ff00ff;
    }

    .neon-orange {
      --neon-color: #ff6b00;
    }

    .neon-yellow {
      --neon-color: #ffff00;
    }

    .neon-purple {
      --neon-color: #b000ff;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      transition: background 0.3s ease;
      margin: 0;
      padding: 0;
    }

    #root {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Auth Screens */
    .auth-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(30deg, var(--border-color) 1px, transparent 1px),
        linear-gradient(120deg, var(--border-color) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.2;
      animation: geometricMove 25s linear infinite;
    }

    .auth-container::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 40px, var(--accent-primary) 40px, var(--accent-primary) 41px),
        repeating-linear-gradient(-45deg, transparent, transparent 40px, var(--accent-secondary) 40px, var(--accent-secondary) 41px);
      opacity: 0.08;
    }

    .geometric-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .geo-shape {
      position: absolute;
      border: 2px solid;
      opacity: 0.2;
    }

    .geo-circle-1 {
      width: 400px;
      height: 400px;
      border-color: var(--accent-primary);
      border-radius: 50%;
      top: -200px;
      right: 5%;
      animation: float1 20s ease-in-out infinite;
    }

    .geo-square-1 {
      width: 300px;
      height: 300px;
      border-color: var(--accent-secondary);
      bottom: -150px;
      left: 10%;
      transform: rotate(45deg);
      animation: float2 18s ease-in-out infinite;
    }

    .geo-triangle-1 {
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid var(--accent-primary);
      opacity: 0.1;
      top: 15%;
      left: -100px;
      animation: float3 22s ease-in-out infinite;
    }

    .geo-hexagon {
      width: 200px;
      height: 200px;
      border-color: var(--accent-glow);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      bottom: 20%;
      right: -50px;
      animation: float4 16s ease-in-out infinite;
    }

    .geo-diamond {
      width: 250px;
      height: 250px;
      border-color: var(--accent-secondary);
      transform: rotate(45deg);
      top: 40%;
      right: 15%;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      animation: float5 19s ease-in-out infinite;
    }

    .geo-circle-2 {
      width: 180px;
      height: 180px;
      border-color: var(--accent-primary);
      border-radius: 50%;
      border-width: 3px;
      bottom: 35%;
      left: 8%;
      animation: float6 14s ease-in-out infinite;
    }

    .geo-rect {
      width: 350px;
      height: 200px;
      border-color: var(--accent-glow);
      top: -100px;
      left: 30%;
      transform: rotate(20deg);
      animation: float7 21s ease-in-out infinite;
    }

    @keyframes geometricMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, 30px) scale(1.05); }
    }

    @keyframes float2 {
      0%, 100% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(225deg) translate(50px, -40px); }
    }

    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.1; }
      50% { transform: translate(60px, 50px) rotate(180deg); opacity: 0.15; }
    }

    @keyframes float4 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(40px, -50px) rotate(120deg); }
    }

    @keyframes float5 {
      0%, 100% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(225deg) translate(-50px, 40px); }
    }

    @keyframes float6 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -30px) scale(1.1); }
    }

    @keyframes float7 {
      0%, 100% { transform: rotate(20deg) translate(0, 0); }
      50% { transform: rotate(200deg) translate(-30px, 40px); }
    }

    .geometric-shape {
      position: absolute;
      border: 2px solid var(--accent-primary);
      opacity: 0.15;
      animation: rotate 15s linear infinite;
    }

    .geometric-shape:nth-child(1) {
      width: 200px;
      height: 200px;
      top: 10%;
      right: 15%;
      border-radius: 50%;
      border-color: var(--accent-primary);
      animation-duration: 20s;
    }

    .geometric-shape:nth-child(2) {
      width: 150px;
      height: 150px;
      bottom: 20%;
      left: 10%;
      transform: rotate(45deg);
      border-color: var(--accent-secondary);
      animation-duration: 25s;
      animation-direction: reverse;
    }

    .geometric-shape:nth-child(3) {
      width: 180px;
      height: 180px;
      top: 50%;
      right: 5%;
      border-radius: 20%;
      border-color: var(--accent-glow);
      animation-duration: 18s;
    }

    .geometric-shape:nth-child(4) {
      width: 100px;
      height: 100px;
      bottom: 15%;
      right: 25%;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      background: linear-gradient(135deg, var(--accent-primary), transparent);
      border: none;
      animation-duration: 22s;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, 30px) rotate(180deg); }
    }

    .auth-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      width: 450px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-logo {
      font-size: 42px;
      font-weight: 700;
      color: var(--neon-color);
      text-shadow: 0 0 20px var(--neon-color), 0 0 40px var(--neon-color);
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      margin-bottom: 36px;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-label {
      display: block;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border: 2px solid transparent;
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
      background: var(--bg-primary);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 217, 255, 0.3);
    }

    .auth-switch {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .auth-switch button {
      background: none;
      border: none;
      color: var(--accent-primary);
      cursor: pointer;
      font-weight: 600;
      margin-left: 6px;
    }

    /* Signup Tabs */
    .signup-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tab-indicator {
      flex: 1;
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .tab-indicator.active {
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }

    .tab-indicator.completed {
      background: var(--accent-glow);
    }

    /* Dashboard */
    .dashboard {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: 60px 1fr;
      background: var(--bg-primary);
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: var(--neon-color);
      text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
      letter-spacing: -0.5px;
      transition: all 0.3s ease;
    }

    .add-pod-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .add-pod-btn:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 4px 16px rgba(0, 217, 255, 0.4);
    }

    .settings-btn {
      padding: 10px 20px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .settings-btn:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
    }

    /* Left Sidebar */
    .left-sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .channels-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .channel-item {
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }

    .channel-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .channel-item.active {
      background: var(--bg-tertiary);
      color: var(--neon-color);
      font-weight: 600;
      border-left: 3px solid var(--neon-color);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
    }

    .channel-icon {
      font-size: 18px;
    }

    .user-profile {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .user-profile:hover {
      background: var(--bg-tertiary);
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .profile-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-menu {
      position: absolute;
      bottom: 100%;
      left: 16px;
      right: 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
    }

    .profile-menu-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .profile-menu-item:hover {
      background: var(--bg-secondary);
    }

    /* Chat Area */
    .chat-area {
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }

    .chat-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--neon-color);
      text-shadow: 0 0 10px var(--neon-color);
    }

    .chat-subtitle {
      font-size: 16px;
      font-weight: 600;
      color: var(--neon-color);
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .chat-description {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-content {
      flex: 1;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }

    .message-author {
      font-weight: 600;
      font-size: 15px;
    }

    .message-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .message-text {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.5;
    }

    .message-input-container {
      padding: 20px 24px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }

    .message-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border: 2px solid transparent;
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
    }

    .message-input:focus {
      border-color: var(--accent-primary);
      background: var(--bg-primary);
    }

    /* Right Sidebar */
    .right-sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .members-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .members-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .member-item {
      padding: 12px 16px;
      margin-bottom: 6px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      border: 2px solid transparent;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-item.online {
      border-color: var(--online-glow);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
    }

    .member-item.offline {
      background: var(--offline-gray);
      opacity: 0.6;
    }

    .member-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }

    .member-name {
      font-weight: 500;
      font-size: 14px;
    }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: modalIn 0.4s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 28px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .modal-body {
      padding: 32px;
    }

    .setting-item {
      margin-bottom: 28px;
    }

    .setting-label {
      display: block;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .setting-description {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .toggle-switch {
      position: relative;
      width: 56px;
      height: 28px;
      background: var(--bg-tertiary);

    function LoginScreen({ onLogin, onSwitchToSignup }) {
      const [email, setEmail] = useState('');

          onLogin({ email, username: email.split('@')[0] });
        }
      };

                  onChange={(e) => setEmail(e.target.value)}

              <div className="input-group">
                <label className="input-label">Password</label>
                <input

              <button onClick={onSwitchToSignup}>Sign Up</button>
            </div>
          </div>
        </div>
      );
    }

    function SignupScreen({ onSignup, onSwitchToLogin }) {
      const [currentTab, setCurrentTab] = useState(0);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [username, setUsername] = useState('');

      const handleNext = () => {
        if (currentTab === 0 && email) setCurrentTab(1);
        else if (currentTab === 1 && password) setCurrentTab(2);
        else if (currentTab === 2 && confirmPassword === password) setCurrentTab(3);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (username && password === confirmPassword) {
          onSignup({ email, username });
        }
      };

      return (
        <div className="auth-container">
          <div className="geometric-shapes">
            <div className="geo-shape geo-circle-1"></div>
            <div className="geo-shape geo-square-1"></div>
            <div className="geo-triangle-1"></div>
            <div className="geo-shape geo-hexagon"></div>
            <div className="geo-shape geo-diamond"></div>
            <div className="geo-shape geo-circle-2"></div>
            <div className="geo-shape geo-rect"></div>
          </div>
          <div className="auth-box">
            <h1 className="auth-logo">Walkie</h1>
            <p className="auth-subtitle">Create your account</p>
            
            <div className="signup-tabs">
              <div className={`tab-indicator ${currentTab >= 0 ? 'active' : ''}`}></div>
              <div className={`tab-indicator ${currentTab >= 1 ? 'active' : ''}`}></div>
              <div className={`tab-indicator ${currentTab >= 2 ? 'active' : ''}`}></div>
              <div className={`tab-indicator ${currentTab >= 3 ? 'active' : ''}`}></div>
            </div>

            <form onSubmit={handleSubmit}>
              {currentTab === 0 && (
                <div className="input-group">
                  <label className="input-label">Email Address</label>
                  <input
                    type="email"
                    className="input-field"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="you@example.com"
                    required
                  />
                </div>
              )}

              {currentTab === 1 && (
                <div className="input-group">
                  <label className="input-label">Password</label>
                  <input
                    type="password"
                    className="input-field"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    required
                  />
                </div>
              )}

              {currentTab === 2 && (
                <div className="input-group">
                  <label className="input-label">Confirm Password</label>
                  <input
                    type="password"
                    className="input-field"
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    placeholder="••••••••"
                    required
                  />

              {currentTab === 3 && (
                <div className="input-group">
                  <label className="input-label">Username / Display Name</label>

                    className="input-field"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Your display name"
                    required
                  />
                </div>
              )}

              {currentTab < 3 ? (
                <button type="button" className="btn-primary" onClick={handleNext}>
                  Next
                </button>

                <button type="submit" className="btn-primary">
                  Create Account
                </button>
              )}

            <div className="auth-switch">
              Already have an account?
              <button onClick={onSwitchToLogin}>Sign In</button>
            </div>
          </div>
        </div>
      );

    function PodOnboarding({ user, onComplete }) {
      const [view, setView] = useState('options'); // 'options', 'create', 'join', 'created'
      const [podName, setPodName] = useState('');
      const [podCode, setPodCode] = useState('');
      const [generatedCode, setGeneratedCode] = useState('');

      const suggestedPods = [
        { id: 1, name: 'Tech Enthusiasts', members: 156, code: 'A7X9K2M4' },
        { id: 2, name: 'Gaming Squad', members: 89, code: 'G4M3R5QD' },
        { id: 3, name: 'Design Community', members: 234, code: 'D3S1GN7Y' },
        { id: 4, name: 'Startup Founders', members: 67, code: 'ST4RTUP8' }
      ];

      const generatePodCode = () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Removed ambiguous characters
        let code = '';
        for (let i = 0; i < 8; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      };

      const handleCreatePod = (e) => {
        e.preventDefault();
        if (podName.trim()) {
          const code = generatePodCode();
          setGeneratedCode(code);
          setView('created');
        }
      };

      const handleContinueToDashboard = () => {
        onComplete({ podName, podCode: generatedCode, isNew: true });
      };

      const handleJoinPod = (podData) => {
        // Simulate joining a pod
        onComplete({ podName: podData.name, podCode: podData.code, isNew: false });
      };

      const handleJoinByCode = (e) => {
        e.preventDefault();
        if (podCode.trim()) {
          onComplete({ podName: 'Pod ' + podCode, podCode: podCode.toUpperCase(), isNew: false });
        }
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(generatedCode);
        alert('Pod code copied to clipboard!');
      };

      return (
        <div className="onboarding-container">

            <div className="geo-shape geo-circle-1"></div>
            <div className="geo-shape geo-square-1"></div>
            <div className="geo-triangle-1"></div>
            <div className="geo-shape geo-hexagon"></div>
            <div className="geo-shape geo-diamond"></div>
            <div className="geo-shape geo-circle-2"></div>
            <div className="geo-shape geo-rect"></div>

              </p>

                  <h3 className="pod-option-title">Create a Pod</h3>
                  <p className="pod-option-description">
                    Start your own community and invite others to join
                  </p>
                </div>

                <div className="pod-option-card" onClick={() => setView('join')}>
                  <div className="pod-option-icon">🚀</div>
                  <h3 className="pod-option-title">Join a Pod</h3>
                  <p className="pod-option-description">
                    Enter a code or browse suggested communities
                  </p>
                </div>
              </div>
            )}

            {view === 'create' && (
              <div className="pod-form">
                <div className="pod-form-title">
                  <button className="back-button" onClick={() => setView('options')}>←</button>

                  <div className="input-group">
                    <label className="input-label">Pod Name</label>
                    <input
                      type="text"
                      className="input-field"
                      value={podName}
                      onChange={(e) => setPodName(e.target.value)}
                      placeholder="Enter your pod name"
                      required
                    />
                  </div>
                  <button type="submit" className="btn-primary">
                    Create Pod & Continue
                  </button>
                </form>
              </div>
            )}

            {view === 'created' && (
              <div className="pod-form">
                <div className="pod-form-title">
                  🎉 Pod Created Successfully!

                <div className="input-group">
                  <label className="input-label">Pod Name</label>
                  <input
                    type="text"
                    className="input-field"
                    value={podName}
                    disabled
                    style={{opacity: 0.7}}

                <div className="pod-code-display">
                  <div className="pod-code-label">Your Pod Invite Code</div>
                  <div className="pod-code-value">{generatedCode}</div>

                <button className="btn-primary" onClick={handleContinueToDashboard}>

            {view === 'join' && (

                <div className="pod-form-title">
                  <button className="back-button" onClick={() => setView('options')}>←</button>
                  Join a Pod
                </div>
                
                <form onSubmit={handleJoinByCode}>
                  <div className="input-group">
                    <label className="input-label">Pod Invite Code</label>
                    <div className="pod-code-input">

                        type="text"

                        Join

                  </div>
                </form>

                <div className="suggested-pods">
                  <div className="suggested-pods-title">Suggested Pods</div>
                  {suggestedPods.map(pod => (
                    <div key={pod.id} className="suggested-pod-item">
                      <div className="suggested-pod-info">
                        <div className="suggested-pod-name">{pod.name}</div>
                        <div className="suggested-pod-members">{pod.members} members</div>
                      </div>
                      <button className="join-pod-btn" onClick={() => handleJoinPod(pod)}>
                        Join
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

      const [settings, setSettings] = useState({
        darkTheme: true,

      });
      const [profileSettings, setProfileSettings] = useState({
        username: user.username,
        avatar: user.username.substring(0, 2).toUpperCase()
      });

      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (newMessage.trim()) {
          const newMsg = {
            id: messages.length + 1,
            author: profileSettings.username,
            text: newMessage,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            avatar: profileSettings.avatar
          };
          setMessages([...messages, newMsg]);
          setNewMessage('');
        }
      };

      const toggleTheme = () => {
        setSettings({ ...settings, darkTheme: !settings.darkTheme });
        document.body.classList.toggle('theme-light');
      };

      const changeNeonColor = (color) => {
        setSettings({ ...settings, neonColor: color });
        // Remove all neon color classes
        document.body.classList.remove('neon-cyan', 'neon-green', 'neon-pink', 'neon-orange', 'neon-yellow', 'neon-purple');
        // Add the selected neon color class
        document.body.classList.add(`neon-${color}`);
      };

      return (
        <div className="dashboard">
          <div className="header">
            <div className="header-left">
              <button className="add-pod-btn" onClick={() => setShowPodModal(true)}>+</button>
              <div className="logo">Walkie</div>
            </div>
            <button className="settings-btn" onClick={() => setShowSettings(true)}>⚙ Settings</button>
          </div>

          <div className="left-sidebar">
            <div className="channels-header">
              Channels in {currentPod.name}
            </div>
            <div className="channels-list">
              {currentPod.channels.map(channel => (
                <div
                  key={channel.id}
                  className={`channel-item ${currentChannel.id === channel.id ? 'active' : ''}`}
                  onClick={() => setCurrentChannel(channel)}
                >
                  <span className="channel-icon">{channel.icon}</span>
                  {channel.name}
                </div>
              ))}
            </div>
            <div className="user-profile" onClick={() => setShowProfileMenu(!showProfileMenu)}>
              <div className="profile-avatar">{profileSettings.avatar}</div>
              <div className="profile-info">
                <div className="profile-name">{profileSettings.username}</div>
                <div className="profile-status">Online</div>
              </div>
              {showProfileMenu && (
                <div className="profile-menu" onClick={(e) => e.stopPropagation()}>
                  <div className="profile-menu-item" onClick={() => {
                    const newUsername = prompt('Enter new username:', profileSettings.username);
                    if (newUsername) {
                      setProfileSettings({
                        ...profileSettings,
                        username: newUsername,
                        avatar: newUsername.substring(0, 2).toUpperCase()
                      });
                    }
                    setShowProfileMenu(false);
                  }}>
                    Change Username
                  </div>
                  <div className="profile-menu-item" onClick={() => {
                    alert('Photo upload feature coming soon!');
                    setShowProfileMenu(false);
                  }}>
                    Change Profile Photo
                  </div>
                  <div className="profile-menu-item" onClick={onLogout}>
                    Logout
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="chat-area">
            <div className="chat-header">
              <div className="chat-title">{currentPod.name}</div>
              <div className="chat-subtitle">#{currentChannel.name}</div>
              <div className="chat-description">Welcome to {currentChannel.name}</div>
            </div>
            <div className="messages-container">
              {messages.map(msg => (
                <div key={msg.id} className="message">
                  <div className="message-avatar">{msg.avatar}</div>
                  <div className="message-content">
                    <div className="message-header">
                      <span className="message-author">{msg.author}</span>
                      <span className="message-time">{msg.time}</span>
                    </div>
                    <div className="message-text">{msg.text}</div>
                  </div>
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>
            <form className="message-input-container" onSubmit={handleSendMessage}>
              <textarea
                className="message-input"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                placeholder={`Message #${currentChannel.name}`}
                rows="1"
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage(e);
                  }
                }}
              />
            </form>
          </div>

          <div className="right-sidebar">
            <div className="members-header">
              Members — {currentPod.members.length}
            </div>
            <div className="members-list">
              {currentPod.members.map(member => (
                <div key={member.id} className={`member-item ${member.online ? 'online' : 'offline'}`}>
                  <div className="member-avatar">{member.name.substring(0, 2).toUpperCase()}</div>
                  <div className="member-name">{member.name}</div>
                </div>
              ))}
            </div>
          </div>

          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h2 className="modal-title">Settings</h2>
                  <button className="modal-close" onClick={() => setShowSettings(false)}>×</button>
                </div>
                <div className="modal-body">
                  <div className="setting-item">
                    <label className="setting-label">Theme</label>
                    <p className="setting-description">Choose between dark and light theme</p>
                    <div className={`toggle-switch ${settings.darkTheme ? 'active' : ''}`} onClick={toggleTheme}>
                      <div className="toggle-slider"></div>
                    </div>
                  </div>

                  <div className="setting-item">
                    <label className="setting-label">Font Size</label>
                    <p className="setting-description">Adjust text size: {settings.fontSize}px</p>
                    <input
                      type="range"
                      className="slider"
                      min="12"
                      max="20"
                      value={settings.fontSize}
                      onChange={(e) => {
                        setSettings({ ...settings, fontSize: parseInt(e.target.value) });
                        document.body.style.fontSize = `${e.target.value}px`;
                      }}
                    />
                  </div>

                  <div className="setting-item">
                    <label className="setting-label">Neon Color</label>
                    <p className="setting-description">Choose your preferred neon accent color</p>
                    <div className="neon-color-picker">
                      <div 
                        className={`neon-color-option neon-cyan-box ${settings.neonColor === 'cyan' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('cyan')}
                      ></div>
                      <div 
                        className={`neon-color-option neon-green-box ${settings.neonColor === 'green' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('green')}
                      ></div>
                      <div 
                        className={`neon-color-option neon-pink-box ${settings.neonColor === 'pink' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('pink')}
                      ></div>
                      <div 
                        className={`neon-color-option neon-orange-box ${settings.neonColor === 'orange' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('orange')}
                      ></div>
                      <div 
                        className={`neon-color-option neon-yellow-box ${settings.neonColor === 'yellow' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('yellow')}
                      ></div>
                      <div 
                        className={`neon-color-option neon-purple-box ${settings.neonColor === 'purple' ? 'active' : ''}`}
                        onClick={() => changeNeonColor('purple')}
                      ></div>
                    </div>
                  </div>

                  <div className="setting-item">
                    <label className="setting-label">Change Password</label>
                    <input
                      type="password"
                      className="input-field"
                      placeholder="Enter new password"
                      value={settings.password}
                      onChange={(e) => setSettings({ ...settings, password: e.target.value })}
                    />
                    <button 
                      className="btn-primary" 
                      style={{ marginTop: '12px' }}
                      onClick={() => {
                        alert('Password updated successfully!');
                        setSettings({ ...settings, password: '' });
                      }}
                    >
                      Update Password
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showPodModal && (
            <div className="modal-overlay" onClick={() => setShowPodModal(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h2 className="modal-title">Create or Join Pod</h2>
                  <button className="modal-close" onClick={() => setShowPodModal(false)}>×</button>
                </div>
                <div className="modal-body">
                  <div className="input-group">
                    <label className="input-label">Pod Name</label>
                    <input
                      type="text"
                      className="input-field"
                      placeholder="Enter pod name"
                    />
                  </div>
                  <div className="pod-modal-content">
                    <button className="btn-secondary" onClick={() => {
                      alert('Create pod feature coming soon!');
                      setShowPodModal(false);
                    }}>
                      Create New Pod
                    </button>
                    <button className="btn-secondary" onClick={() => {
                      alert('Join pod feature coming soon!');
                      setShowPodModal(false);
                    }}>
                      Join Existing Pod
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('login');
      const [user, setUser] = useState(null);
      const [hasJoinedPod, setHasJoinedPod] = useState(false);
      const [podData, setPodData] = useState(null);

      const handleLogin = (userData) => {
        setUser(userData);
        // Existing users go straight to dashboard with default pod
        setHasJoinedPod(true);
        setPodData({ podName: 'Tech Enthusiasts', podCode: 'A7X9K2M4' });
        setScreen('dashboard');
      };

      const handleSignup = (userData) => {
        setUser(userData);
        // New users need to join/create a pod first
        setHasJoinedPod(false);
        setScreen('onboarding');
      };

      const handlePodOnboardingComplete = (data) => {
        setPodData(data);
        setHasJoinedPod(true);
        setScreen('dashboard');
      };

      const handleLogout = () => {
        setUser(null);
        setHasJoinedPod(false);
        setPodData(null);
        setScreen('login');
      };

      return (
        <>
          {screen === 'login' && (
            <LoginScreen 
              onLogin={handleLogin} 
              onSwitchToSignup={() => setScreen('signup')} 
            />
          )}
          {screen === 'signup' && (
            <SignupScreen 
              onSignup={handleSignup} 
              onSwitchToLogin={() => setScreen('login')} 
            />
          )}
          {screen === 'onboarding' && user && (
            <PodOnboarding 
              user={user} 
              onComplete={handlePodOnboardingComplete} 
            />
          )}
          {screen === 'dashboard' && user && hasJoinedPod && (
            <Dashboard user={user} onLogout={handleLogout} podData={podData} />
          )}
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
